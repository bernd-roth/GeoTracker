services:
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "192.168.0.82:6379:6379"
    volumes:
      - ../redis/data:/data
    env_file:
      - ../redis/.env
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - redis-network

  postgres-geotracker:
    image: postgres:15
    container_name: postgres-geotracker
    restart: unless-stopped
    environment:
      POSTGRES_DB: geotracker
      POSTGRES_USER: geotracker
      POSTGRES_PASSWORD: xxx
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "8021:5432"
    volumes:
      - /home/bernd/docker-container/postgres-geotracker/data:/var/lib/postgresql/data
      - /home/bernd/docker-container/postgres-geotracker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotracker -d geotracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - geotracker-network
  nginx:
    restart: always
    image: arm64v8/nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./static:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./.htpasswd:/etc/nginx/.htpasswd
      - ./ssl:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot
    depends_on:
      - websocket-server
      - flask-api
    networks:
      - app-network
  websocket-server:
    restart: always
    image: arm64v8/python:3.9-slim
    volumes:
      - ./websocket_server.py:/app/websocket_server.py
      - ./logs:/app/logs
    command: >
      sh -c "pip install websockets asyncpg python-dateutil redis &&
             python /app/websocket_server.py"
    expose:
      - "6789"
    environment:
      - USE_DATABASE=true
      - DATA_RETENTION_HOURS=48
      - POSTGRES_HOST=postgres-geotracker
      - POSTGRES_PORT=5432
      - POSTGRES_DB=geotracker
      - POSTGRES_USER=geotracker
      - POSTGRES_PASSWORD=xxx
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_HISTORY_KEY=geotracker:live:tracking_points
    env_file:
      - ../redis/.env
    depends_on:
      postgres-geotracker:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
      - geotracker-network
      - redis-network
  flask-api:
    restart: always
    build:
      context: /home/bernd/docker-container/geotracker-flask
      dockerfile: Dockerfile
    volumes:
      - /home/bernd/docker-container/geotracker-flask/logs:/app/logs
      - /home/bernd/docker-container/geotracker/media:/home/bernd/docker-container/geotracker/media
    expose:
      - "5000"
    environment:
      - FLASK_ENV=production
      - POSTGRES_HOST=postgres-geotracker
      - POSTGRES_PORT=5432
      - POSTGRES_DB=geotracker
      - POSTGRES_USER=geotracker
      - POSTGRES_PASSWORD=xxx
    depends_on:
      postgres-geotracker:
        condition: service_healthy
    networks:
      - app-network
      - geotracker-network
  certbot:
    image: certbot/certbot
    container_name: certbot-geotracker
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
      - ./duckdns-auth.sh:/scripts/duckdns-auth.sh:ro
      - ./duckdns-cleanup.sh:/scripts/duckdns-cleanup.sh:ro
      - ./duckdns.ini:/etc/duckdns.ini:ro
    networks:
      - app-network
networks:
  app-network:
    name: geotracker_app-network
    driver: bridge
  geotracker-network:
    name: geotracker-network
    driver: bridge
  redis-network:
    name: redis_default
    external: true
